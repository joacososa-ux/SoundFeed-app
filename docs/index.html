<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundFeed</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0e0b17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=15">
<link rel="stylesheet" href="premium.css?v=5">
<link rel="stylesheet" href="profile.css?v=2">
<link rel="stylesheet" href="player.css?v=1">
<script>try{if(localStorage.getItem("sf_glass")!=="0")document.documentElement.classList.add("glass")}catch(e){document.documentElement.classList.add("glass")}</script>
<style>
html{background:#0e0b17}
#boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(60% 42% at 50% 44%,rgba(124,58,237,.24),rgba(14,11,23,0) 72%),#0e0b17;transition:opacity .6s ease,visibility 0s .6s}
#boot.out{opacity:0;visibility:hidden;pointer-events:none}
#boot svg{width:108px;height:108px;overflow:visible;animation:bootGlow 2.6s ease-in-out infinite}
#boot .bub{stroke-dasharray:1;stroke-dashoffset:1;animation:bootDraw 1.1s cubic-bezier(.65,0,.35,1) .1s forwards}
#boot .bar{transform-box:fill-box;transform-origin:center;transform:scaleY(.3);animation:bootBar 1.15s ease-in-out infinite;animation-delay:.55s}
#boot .bar:nth-child(2){animation-delay:.7s}
#boot .bar:nth-child(3){animation-delay:.85s}
#boot .bar:nth-child(4){animation-delay:1s}
#boot .bar:nth-child(5){animation-delay:1.15s}
#boot .wm{font-family:Syne,system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1;color:#fff;opacity:0;transform:translateY(8px);transition:opacity .6s ease .2s,transform .6s ease .2s}
#boot .wm b{background:linear-gradient(90deg,#2be3f2,#ff3d9a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#boot.f .wm{opacity:1;transform:none}
@keyframes bootDraw{to{stroke-dashoffset:0}}
@keyframes bootBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.2)}}
@keyframes bootGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(43,227,242,.25))}50%{filter:drop-shadow(0 0 18px rgba(255,61,154,.5))}}
@media (prefers-reduced-motion:reduce){#boot svg,#boot .bar{animation:none}#boot .bar{transform:none}#boot .bub{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="boot" role="status" aria-label="Cargando SoundFeed">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="5" y1="5" x2="43" y2="43"><stop offset="0" stop-color="#2be3f2"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient></defs>
    <path class="bub" pathLength="1" d="M24 5C13 5 5 12.6 5 22.4c0 5.2 2.4 9.7 6.2 12.8L9 43l8.3-4.1c2 .6 4.2.9 6.7.9 11 0 19-7.6 19-17.4S35 5 24 5z" fill="none" stroke="url(#bg)" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="url(#bg)" stroke-width="3" stroke-linecap="round"><path class="bar" d="M16 20v6"/><path class="bar" d="M21 15v16"/><path class="bar" d="M26 12v22"/><path class="bar" d="M31 17v12"/><path class="bar" d="M36 21v4"/></g>
  </svg>
  <div class="wm">Sound<b>Feed</b></div>
</div>
<script>
(function(){var b=document.getElementById('boot');if(!b)return;var f=function(){b.classList.add('f')};
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('800 30px Syne'),new Promise(function(r){setTimeout(r,1500)})]).then(f,f)}else f();
setTimeout(function(){var x=document.getElementById('boot');if(x){x.classList.add('out');setTimeout(function(){x.remove()},800)}},12000);})();
</script>
<div class="amb" aria-hidden="true"><i class="o a"></i><i class="o b"></i><i class="o c"></i></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#inicio" aria-label="SoundFeed, ir al inicio">
      <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2be3f2"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient></defs>
        <path d="M24 5C13 5 5 12.6 5 22.4c0 5.2 2.4 9.7 6.2 12.8L9 43l8.3-4.1c2 .6 4.2.9 6.7.9 11 0 19-7.6 19-17.4S35 5 24 5z" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round"/>
        <g stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><path d="M16 20v6M21 15v16M26 12v22M31 17v12M36 21v4"/></g>
      </svg>
      <span>Sound<b>Feed</b></span>
    </a>
    <div class="top-right" id="account"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<script type="module" src="js/app.js?v=19"></script>
</body>
</html>
